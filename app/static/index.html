<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteGuard · 企业网站维护助手</title>
<style>
  :root{
    --ink:#1a1d23; --ink2:#5a6274; --ink3:#8b93a3;
    --line:#e3e6ec; --bg:#f6f7f9; --card:#fff;
    --ok:#2f7a45; --ok-bg:#edf7f0;
    --bad:#c62828; --bad-bg:#fdeded;
    --warn:#9a6410; --warn-bg:#fdf5e6;
    --accent:#1f5fa9; --accent-bg:#eaf2fb;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;
    font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;}
  .wrap{max-width:1440px;margin:0 auto;padding:20px 22px 40px;}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  h1{font-size:20px;margin:0;font-weight:700;}
  .sub{color:var(--ink3);font-size:12.5px;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 20px;}
  .badge{padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink2);}
  .badge.ok{background:var(--ok-bg);color:var(--ok);border-color:#cfe6d6;}
  .badge.bad{background:var(--bad-bg);color:var(--bad);border-color:#f3cfcf;}
  .badge.warn{background:var(--warn-bg);color:var(--warn);border-color:#f0e0bf;}
  .mocknote{background:var(--warn-bg);border:1px solid #f0e0bf;color:var(--warn);
    border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.6;margin-bottom:10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 12px;font-weight:700;}
  #authPanel summary{cursor:pointer;font-weight:700;}
  #authForm{margin-top:12px;}
  #authForm label{font-size:13px;}
  #apiToken{flex:1;min-width:160px;}
  #authStatus{margin:8px 0 0;font-size:12.5px;overflow-wrap:anywhere;}
  input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none;}
  input:focus{border-color:var(--accent);}
  button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;}
  button:hover{border-color:var(--accent);color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{opacity:.9;color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;}
  .site{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--line);}
  .site.ok{border-top-color:var(--ok);}
  .site.bad{border-top-color:var(--bad);}
  .site.unknown{border-top-color:var(--ink3);}
  .site .nm{font-weight:700;font-size:14.5px;}
  .site .u{color:var(--ink3);font-size:12px;word-break:break-all;margin-bottom:10px;}
  .metrics{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-bottom:12px;}
  .metrics span{color:var(--ink3);}
  .metrics b{color:var(--ink);font-weight:700;}
  .metrics span.warn{color:var(--warn);}
  .metrics span.warn b{color:var(--warn);}
  .link-counts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px;}
  .link-counts span{padding:3px 8px;border-radius:6px;background:#f3f4f7;}
  .link-counts .broken{color:var(--bad);background:var(--bad-bg);}
  .link-counts .server-error{color:var(--warn);background:var(--warn-bg);}
  .link-counts .unverified{color:var(--ink2);}
  .link-group{margin:12px 0;padding:10px 12px;border-left:3px solid var(--line);background:var(--bg);border-radius:6px;}
  .link-group.broken{border-left-color:var(--bad);}
  .link-group.server-error{border-left-color:var(--warn);}
  .link-group h4{font-size:12.5px;margin:0 0 5px;}
  .link-group.broken h4{color:var(--bad);}
  .link-group.server-error h4{color:var(--warn);}
  .link-examples{margin:8px 0 0;padding-left:18px;}
  .link-examples li{margin-bottom:8px;overflow-wrap:anywhere;}
  .link-examples a{color:var(--accent);}
  .modelnote{margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .diag{overflow-wrap:anywhere;}
  .trend-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;}
  select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%;}
  #trendChart{width:100%;height:280px;}
  #trendCard{margin-bottom:20px;}
  #trendStatus p{margin:8px 0;}
  .empty{color:var(--ink3);font-size:13px;padding:18px 0;text-align:center;}
  .notice{grid-column:1/-1;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);}
  .notice.error,.inline-error{color:var(--bad);}
  .notice p{margin:0 0 8px;}
  .site-status{margin:10px 0;color:var(--ink2);font-size:12.5px;}
  .issues{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;}
  .issues[hidden],.diag:empty{display:none;}
  .issues h3{margin:0 0 8px;font-size:13px;}
  .issue-list{list-style:none;margin:0;padding:0;}
  .issue-list li{padding:10px 0;border-bottom:1px solid var(--line);}
  .issue-list li:last-child{border-bottom:0;}
  .issue-category{margin-left:7px;font-size:12px;color:var(--ink2);overflow-wrap:anywhere;}
  .issue-message{margin-top:5px;overflow-wrap:anywhere;}
  .issue-hint{color:var(--ink3);font-size:12px;margin:8px 0 0;}
  .inline-error{overflow-wrap:anywhere;}
  .inline-error p{margin:0 0 8px;}
  .dashboard{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(0,1.2fr);gap:18px;align-items:start;}
  .dashboard-main{min-width:0;}
  #grid{grid-template-columns:minmax(0,1fr);max-height:76vh;overflow:auto;padding:2px;align-content:start;}
  .site.selected{outline:2px solid var(--accent);outline-offset:-1px;}
  .site-picker{padding:0;border:0;font-weight:700;text-align:left;font-size:14.5px;}
  .health-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--ink3);}
  .health-dot.ok{background:var(--ok);}.health-dot.bad{background:var(--bad);}
  .health-label{font-size:12px;font-weight:400;}
  #trendChart{height:190px;}#trendCard{margin-bottom:14px;padding:14px 18px;}
  #adviceBody{max-height:54vh;overflow:auto;padding:2px;}
  .advice-summary{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px;}
  .advice-details summary{cursor:pointer;color:var(--accent);font-weight:700;}
  .patch-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;}
  .patch-card h4{margin:0;font-size:13px;color:var(--ink);}.patch-card pre{max-height:220px;margin-bottom:6px;}
  .patch-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .patch-warn{border:1px solid #f0e0bf;border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--warn-bg);color:var(--warn);font-size:12.5px;}
  .patch-warn b{display:block;margin-bottom:4px;}
  .patch-warn ul{margin:0;padding-left:18px;}.patch-warn li{overflow-wrap:anywhere;}
  .verification{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px;background:var(--bg);}
  .comparison-list{padding-left:18px;}.comparison-list li{margin:7px 0;overflow-wrap:anywhere;}
  .comparison-list .resolved{color:var(--ok);}.comparison-list .remaining,.comparison-list .worsened{color:var(--bad);}
  .manual-copy{width:100%;min-height:140px;font:12px/1.6 Consolas,monospace;white-space:pre;}
  @media(min-width:851px){
    .bar{margin:10px 0 12px;}.wrap>.card{padding:12px 16px;margin-bottom:12px;}
    #authPanel{padding:8px 14px;margin-bottom:10px;}
    .dashboard{height:calc(100dvh - 325px);min-height:350px;grid-template-rows:minmax(0,1fr);align-items:stretch;}
    .dashboard>section{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
    #grid{height:auto;max-height:none;flex:1;min-height:0;}
    .dashboard-main{display:grid;grid-template-rows:210px minmax(0,1fr);gap:14px;height:100%;min-height:0;}
    #trendCard{margin:0;padding:10px 14px;overflow:auto;}#trendChart{height:100px;}
    #trendCard h2{margin-bottom:4px;}.trend-toolbar{margin:4px 0;}
    #trendCard>p.sub:first-of-type{display:none;}#trendSummary{margin:4px 0;line-height:1.5;}
    #adviceCard{display:flex;flex-direction:column;min-height:0;margin:0;padding:12px 16px;}
    #adviceBody{flex:1;min-height:0;max-height:none;}
  }
  @media(max-width:850px){.dashboard{grid-template-columns:minmax(0,1fr);}#grid{max-height:none;}#adviceBody{max-height:none;}}
  @media(max-width:480px){.wrap{padding:18px 12px 40px;}.grid{grid-template-columns:minmax(0,1fr);}.row input{width:100%!important;}.site{min-width:0;padding:14px;}.metrics{gap:10px;}#trendChart{height:240px;}.trend-toolbar select{width:100%;}}
  pre{background:#f3f4f7;border:1px solid var(--line);border-radius:8px;padding:12px;
    overflow:auto;font-size:12.5px;line-height:1.6;font-family:Consolas,Menlo,monospace;}
  .diag{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px;}
  .sev{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:700;}
  .sev.P0{background:var(--bad-bg);color:var(--bad);}
  .sev.P1{background:var(--warn-bg);color:var(--warn);}
  .sev.P2{background:var(--accent-bg);color:var(--accent);}
  .sev.P3{background:#f1ebfa;color:#70509a;}
  .diag h4{font-size:12.5px;margin:12px 0 4px;color:var(--ink2);}
  .diag ul{margin:0;padding-left:18px;}
  .diag li{margin-bottom:4px;}
  .diag li i{font-style:normal;color:var(--ink3);}
  #toast{position:sticky;bottom:0;margin-top:16px;font-size:12.5px;color:var(--ink2);min-height:20px;}
  #toast:empty{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SiteGuard</h1>
    <span class="sub">AI 自动化企业网站维护助手 · 华为云 CodeArts + MaaS</span>
  </header>
  <div class="bar">
    <span class="badge" id="maasBadge">MaaS：检测中…</span>
    <span class="badge" id="aiModeBadge">AI：检测中…</span>
    <span class="badge" id="schedBadge">调度器：检测中…</span>
    <button id="pingButton" onclick="pingMaas()">测试大模型连通性</button>
  </div>

  <details class="card" id="authPanel">
    <summary>访问设置 <span class="badge" id="authBadge">未填写令牌</span></summary>
    <form id="authForm" onsubmit="applyToken(event)">
      <div class="row">
        <label for="apiToken">访问令牌</label>
        <input id="apiToken" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="authHint" placeholder="部署启用访问验证时填写">
        <button class="primary" id="applyTokenButton" type="submit">应用并刷新</button>
        <button id="clearTokenButton" type="button" onclick="clearToken()" disabled>清除令牌</button>
      </div>
      <p id="authHint" class="sub">本地未启用访问验证时可留空。令牌仅在当前页面有效，刷新或关闭页面后需重新填写。</p>
      <p id="authStatus" class="sub" role="status" aria-live="polite">未填写访问令牌。</p>
    </form>
  </details>

  <div class="card">
    <h2>添加监控站点</h2>
    <div class="row">
      <input id="siteName" aria-label="站点名称" placeholder="站点名称（可留空）" style="width:200px">
      <input id="siteUrl" aria-label="站点地址" placeholder="请输入真实网站地址" style="width:300px">
      <button id="addButton" class="primary" onclick="addSite()">添加</button>
      <button id="scanAllButton" onclick="scanAll()">立即巡检全部</button>
      <button id="refreshButton" onclick="refresh()">刷新</button>
    </div>
  </div>

  <div class="dashboard">
  <section aria-label="监控站点列表">
    <h2 style="font-size:14px;margin:0 0 10px">监控站点 <span class="sub">选择站点查看趋势与修复方案</span></h2>
    <div class="grid" id="grid" aria-busy="true"><div class="notice" role="status">正在加载监控站点…</div></div>
  </section>
  <div class="dashboard-main">
  <section class="card" id="trendCard" aria-labelledby="trendTitle" aria-busy="true">
    <h2 id="trendTitle">响应耗时趋势</h2>
    <div class="trend-toolbar">
      <label for="trendSite">站点</label>
      <select id="trendSite" onchange="selectTrend()" disabled><option>正在加载站点…</option></select>
      <button id="trendRefresh" onclick="loadTrend()" disabled>刷新趋势</button>
    </div>
    <p class="sub">最近 50 次巡检记录 · 耗时单位毫秒（ms） · 查看趋势不会发起新巡检</p>
    <div id="trendStatus" role="status" aria-live="polite">正在加载站点…</div>
    <div id="trendChart" role="img" aria-label="响应耗时趋势" hidden></div>
    <p id="trendSummary" class="sub"></p>
  </section>
  <section class="card" id="adviceCard" aria-labelledby="adviceTitle">
    <h2 id="adviceTitle">AI 建议与修复验证</h2>
    <div id="adviceBody"><p class="sub">选择一个已巡检的站点，获取诊断和修复方案。</p></div>
  </section>
  </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let rows = [];
const siteStates = new Map();
let overviewLoading = false;
let overviewError = '';
let overviewRequest = 0;
let adding = false;
let activeScan = null;
let pinging = false;
let accessToken = '';
let authVersion = 0;
let authUpdating = false;
let statusRequest = 0;
let trendSiteId = null;
let trendScanId = null;
let trendRequest = 0;
let trendLoading = false;
let trendError = '';
let trendHistory = null;
let chartLibraryPromise = null;
let trendChart = null;
// 本地打包 ECharts 6.0.0（Apache-2.0），不依赖外网 CDN —— 答辩/演示现场断网也能出图
const ECHARTS_URL = '/static/vendor/echarts.min.js';

function toast(msg) { $('toast').textContent = msg; }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function authBusy() {
  return authUpdating || adding || pinging || activeScan !== null || rows.some((r) => {
    const s = siteStates.get(r.site_id);
    return s?.diagnosing || s?.deleting || s?.verifying;
  });
}

function authNotice(message, failed = false) {
  $('authStatus').textContent = message;
  $('authStatus').className = failed ? 'inline-error' : 'sub';
  $('authStatus').setAttribute('role', failed ? 'alert' : 'status');
  if (failed) $('authPanel').open = true;
}

async function updateToken(token) {
  if (authBusy()) { authNotice('请等待当前操作结束，再更改访问令牌。', true); return; }
  if (/[^\x21-\x7e]/.test(token)) { authNotice('请填写不含空格、换行或中文的访问令牌。', true); return; }
  accessToken = token;
  ++authVersion;
  authUpdating = true;
  $('apiToken').value = '';
  $('authBadge').textContent = token ? '已填写令牌' : '未填写令牌';
  authNotice(token ? '令牌已应用，仅在当前页面有效。' : '已清除令牌；未启用访问验证的服务可直接使用。');
  toast('');
  // 更换访问设置后重新读取数据，不重放巡检、诊断或删除等操作。
  rows = [];
  siteStates.clear();
  overviewError = '';
  syncTrendSites(false);
  render();
  try { await refresh(); }
  finally { authUpdating = false; syncControls(); }
}

function applyToken(event) {
  event.preventDefault();
  return updateToken($('apiToken').value.trim());
}

function clearToken() { return updateToken(''); }

async function api(path, options = {}, timeout = 15000) {
  const target = new URL(path, window.location.href);
  if (target.origin !== window.location.origin || !target.pathname.startsWith('/api/')) throw new Error('仅支持当前站点的接口请求。');
  const version = authVersion;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const headers = new Headers(options.headers);
    if (accessToken) headers.set('Authorization', 'Bearer ' + accessToken);
    const resp = await fetch(path, { ...options, headers, signal: controller.signal, redirect: 'error' });
    if (resp.status === 401) {
      const message = '访问验证未通过，请在“访问设置”中填写或更换令牌，再重试原操作。';
      if (version === authVersion) authNotice(message, true);
      throw new Error(message);
    }
    const text = await resp.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error('服务返回了无法识别的数据，请稍后重试。'); }
    if (!resp.ok) throw Object.assign(new Error(typeof data.detail === 'string' ? data.detail : ('请求失败（HTTP ' + resp.status + '）')), { status: resp.status });
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('请求超时，请稍后重试。');
    if (e instanceof TypeError) throw new Error('无法连接服务，请确认项目已启动。');
    throw e;
  } finally { clearTimeout(timer); }
}

async function loadStatus() {
  const request = ++statusRequest;
  try {
    const s = await api('/api/status');
    if (request !== statusRequest) return;
    $('maasBadge').textContent = 'MaaS：' + (s.maas_configured ? (s.maas_model + ' 已配置') : '未配置');
    $('maasBadge').className = 'badge ' + (s.maas_configured ? 'ok' : 'warn');
    const m = $('aiModeBadge');
    m.textContent = s.mock_active ? 'AI：模拟模式（内置诊断）' : 'AI：真实大模型';
    m.className = 'badge ' + (s.mock_active ? 'warn' : 'ok');
    m.title = s.mock_active ? '结论由内置规则生成，未调用真实大模型。' : '已选择真实模型模式，可点击连通性测试确认服务可用。';
    $('schedBadge').textContent = '调度器：' + (s.scheduler.running ? ('每 ' + s.scheduler.interval_minutes + ' 分钟') : '未启动');
    $('schedBadge').className = 'badge ' + (s.scheduler.running ? 'ok' : 'warn');
  } catch (e) {
    if (request !== statusRequest) return;
    for (const id of ['maasBadge', 'aiModeBadge', 'schedBadge']) {
      $(id).textContent = '状态读取失败';
      $(id).className = 'badge bad';
    }
    toast('读取状态失败：' + e.message);
  }
}

function stateFor(row) {
  let state = siteStates.get(row.site_id);
  if (!state) {
    state = { scanId: row.scan_id, expanded: false, issues: null, links: null, loading: false, error: '', diagnosis: null, diagnosing: false, diagnosisError: '', deleting: false, scanError: '', patches: null, patchWarnings: [], patchLoading: false, patchError: '', patchRequest: 0, adviceExpanded: false, verifying: false, verification: null, copyStatus: '', manualCopy: null };
    siteStates.set(row.site_id, state);
  } else if (state.scanId !== row.scan_id) {
    // 明细与诊断绑定巡检记录；新巡检不能继续显示旧记录的结论。
    Object.assign(state, { scanId: row.scan_id, issues: null, links: null, loading: false, error: '', diagnosis: null, diagnosing: false, diagnosisError: '', patches: null, patchWarnings: [], patchLoading: false, patchError: '', patchRequest: state.patchRequest + 1, copyStatus: '', manualCopy: null });
    if (!state.verifying) state.verification = null;
  }
  return state;
}

function syncControls() {
  $('applyTokenButton').disabled = authBusy();
  $('applyTokenButton').textContent = authUpdating ? '刷新中…' : '应用并刷新';
  $('clearTokenButton').disabled = authBusy() || !accessToken;
  $('apiToken').disabled = authBusy();

  const working = rows.some((r) => { const s = stateFor(r); return s.diagnosing || s.deleting || s.verifying; });
  $('addButton').disabled = adding;
  $('addButton').textContent = adding ? '添加中…' : '添加';
  $('siteName').disabled = adding;
  $('siteUrl').disabled = adding;
  $('scanAllButton').disabled = activeScan !== null || working || !rows.length;
  $('scanAllButton').textContent = activeScan === 'all' ? '正在巡检全部…' : '立即巡检全部';
  $('refreshButton').disabled = overviewLoading || activeScan !== null || working;
  $('refreshButton').textContent = overviewLoading ? '刷新中…' : '刷新';
  $('grid').setAttribute('aria-busy', String(overviewLoading));
}

function renderIssues(row, state) {
  if (!state.expanded) return '';
  if (row.scan_id == null) return '<p class="sub">尚未巡检，请先点击“巡检”。</p>';
  if (state.loading) return '<p class="sub" role="status">正在加载问题明细…</p>';
  if (state.error) return `<div class="inline-error" role="alert"><p>加载问题明细失败：${esc(state.error)}</p><button onclick="loadIssues(${row.site_id})">重试加载</button></div>`;
  if (state.issues === null) return '<p class="sub">问题明细尚未加载。</p>';
  const links = renderLinkGroups(state.links);
  if (!state.issues.length) return links + '<p class="sub">本次巡检未发现问题。</p>';
  return `<h3>巡检问题 · ${state.issues.length} 项</h3><ul class="issue-list">${state.issues.map((issue) => {
    const level = ['P0', 'P1', 'P2', 'P3'].includes(issue.level) ? issue.level : '';
    return `<li><span class="sev ${level}">${esc(issue.level || '未分级')}</span><span class="issue-category">分类：${esc(issue.category || '未分类')}</span><div class="issue-message">${esc(issue.message)}</div></li>`;
  }).join('')}</ul>${links}<p class="issue-hint">以上为巡检发现的问题；根因与处置建议请查看 AI 诊断。</p>`;
}

function linkText(url) {
  try {
    const parsed = new URL(String(url));
    if (['http:', 'https:'].includes(parsed.protocol)) return `<a href="${esc(parsed.href)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`;
  } catch {}
  return esc(url || '未提供地址');
}

function renderLinkGroups(report) {
  const groups = [
    ['broken_links', 'broken', '失效（404/410）', '资源不存在，需要修复链接。'],
    ['server_error_links', 'server-error', '服务端错误（5xx）', '可能是瞬时故障，请先复测。'],
    ['unverified_links', 'unverified', '待确认（无法验证）', '403/429、超时等不等于失效，请人工抽查。'],
  ];
  return groups.map(([key, cls, label, hint]) => {
    const links = Array.isArray(report?.[key]) ? report[key] : null;
    const examples = links ? links.slice(0, 5).map((link) => `<li>${linkText(link?.url)}<br><span class="sub">${link?.status == null ? '未取得响应' : 'HTTP ' + esc(link.status)}${link?.reason ? ' · ' + esc(link.reason) : ''}</span></li>`).join('') : '';
    return `<section class="link-group ${cls}"><h4>${label}${links ? ' · ' + links.length + ' 条' : ''}</h4><div class="sub">${hint}</div>${examples ? `<ul class="link-examples">${examples}</ul>` : `<p class="sub">${links ? '本次没有此类链接。' : '当前记录未提供此类链接清单。'}</p>`}${links?.length > 5 ? `<p class="sub">展示前 5 条，共 ${links.length} 条。</p>` : ''}</section>`;
  }).join('');
}

function render() {
  const focusId = document.activeElement?.id;
  const grid = $('grid');
  const notice = overviewError
    ? `<div class="notice error" role="alert"><p>加载站点失败：${esc(overviewError)}${rows.length ? ' 当前保留上次加载的站点。' : ''}</p><button onclick="load()">重试加载站点</button></div>`
    : overviewLoading ? '<div class="notice" role="status">正在加载监控站点…</div>' : '';
  const empty = !rows.length && !overviewLoading && !overviewError
    ? '<div class="notice empty">还没有监控站点。请在上方填写真实网站地址并点击“添加”，再进行巡检。</div>' : '';
  grid.innerHTML = notice + empty + rows.map((r) => {
    const s = stateFor(r);
    const scanning = activeScan === 'all' || activeScan === r.site_id;
    const working = scanning || s.diagnosing || s.deleting || s.verifying;
    const health = healthFor(r, s);
    const state = health.state;
    const label = r.scan_id == null ? '尚未巡检' : (r.is_ok ? '可访问' : '访问异常');
    const ssl = r.ssl_days_left == null ? '—' : (r.ssl_days_left + ' 天');
    return `<div class="site ${state} ${trendSiteId === r.site_id ? 'selected' : ''}" id="site-${r.site_id}">
      <div class="nm"><button class="site-picker" id="select-${r.site_id}" onclick="selectSite(${r.site_id})" aria-pressed="${trendSiteId === r.site_id}">${esc(r.name)}</button> <span class="health-label"><span class="health-dot ${state}" aria-hidden="true"></span>${esc(health.label)}</span></div>
      <div class="u">${esc(r.url)}</div>
      <p class="sub">${label} · ${r.scan_id == null ? '等待首次巡检' : '巡检 #' + r.scan_id}${s.error ? ` · 明细未读取，<button onclick="loadIssues(${r.site_id})">重试状态</button>` : ''}</p>
      <div class="metrics">
        <span>状态码 <b>${r.status_code ?? '—'}</b></span>
        <span>响应 <b>${r.response_ms != null ? r.response_ms + ' ms' : '—'}</b></span>
        <span>SSL <b>${ssl}</b></span>
      </div>
      <div class="link-counts" aria-label="三类链接检查结果">
        <span class="broken" title="404/410：资源不存在，需要修复">失效 <b>${r.scan_id == null ? '—' : r.broken_links ?? 0}</b></span>
        <span class="server-error" title="5xx：可能是瞬时故障，请先复测">服务端错误 <b>${r.scan_id == null ? '—' : r.link_server_error ?? 0}</b></span>
        <span class="unverified" title="403/429、超时等不等于失效，需要人工确认">待确认 <b>${r.scan_id == null ? '—' : r.link_unverified ?? 0}</b></span>
      </div>
      <div class="row">
        <button id="scan-${r.site_id}" onclick="scanOne(${r.site_id})" ${activeScan !== null || working ? 'disabled' : ''}>${scanning ? '巡检中…' : '巡检'}</button>
        <button id="toggle-${r.site_id}" onclick="toggleIssues(${r.site_id})" aria-expanded="${s.expanded}" aria-controls="issues-${r.site_id}">${s.expanded ? '收起问题' : '查看问题'}</button>
        <button id="diagnose-${r.site_id}" onclick="diagnose(${r.site_id}, ${r.scan_id ?? 'null'})" ${r.scan_id == null || working ? 'disabled' : ''}>${s.diagnosing ? '诊断中…' : 'AI 诊断'}</button>
        <button onclick="removeSite(${r.site_id})" ${activeScan !== null || working ? 'disabled' : ''}>${s.deleting ? '删除中…' : '删除'}</button>
      </div>
      ${scanning ? '<p class="site-status" role="status">正在巡检，链接需二次复核，请稍候。完成前不能重复发起巡检。</p>' : ''}
      ${s.scanError ? `<p class="site-status inline-error" role="alert">巡检失败：${esc(s.scanError)}。可点击“巡检”重试。</p>` : ''}
      <div class="issues" id="issues-${r.site_id}" ${s.expanded ? '' : 'hidden'} aria-busy="${s.loading}">${renderIssues(r, s)}</div>
    </div>`;
  }).join('');
  renderAdvice();
  syncControls();
  if (focusId && $(focusId) && !$(focusId).disabled) $(focusId).focus({ preventScroll: true });
}

async function load() {
  const request = ++overviewRequest;
  overviewLoading = true;
  overviewError = '';
  render();
  try {
    const result = await api('/api/overview');
    if (!Array.isArray(result)) throw new Error('站点列表格式不正确。');
    if (request !== overviewRequest) return;
    rows = result;
    const ids = new Set(rows.map((r) => r.site_id));
    for (const id of siteStates.keys()) if (!ids.has(id)) siteStates.delete(id);
    rows.forEach(stateFor);
  } catch (e) {
    if (request === overviewRequest) overviewError = e.message;
  } finally {
    if (request === overviewRequest) {
      overviewLoading = false;
      render();
      for (const r of rows) {
        const s = stateFor(r);
        if (r.scan_id != null && s.issues === null && !s.loading && !s.error) loadIssues(r.site_id);
      }
      syncTrendSites(!overviewError);
      render();
      const selected = rows.find((r) => r.site_id === trendSiteId);
      if (selected && selected.scan_id != null) {
        const s = stateFor(selected);
        if (s.patches === null && !s.patchLoading && !s.patchError && !s.diagnosing) loadPatches(selected.site_id, true);
      }
    }
  }
}

function toggleIssues(id) {
  const row = rows.find((r) => r.site_id === id);
  if (!row) return;
  const s = stateFor(row);
  s.expanded = !s.expanded;
  render();
  if (s.expanded && row.scan_id != null && s.issues === null && !s.loading) loadIssues(id);
}

async function loadIssues(id) {
  const row = rows.find((r) => r.site_id === id);
  if (!row || row.scan_id == null) return;
  const s = stateFor(row);
  if (s.loading) return;
  const scanId = row.scan_id;
  s.loading = true;
  s.error = '';
  render();
  try {
    const scan = await api('/api/scans/' + scanId);
    const issues = Array.isArray(scan.report?.issues) ? scan.report.issues : scan.issues;
    if (!Array.isArray(issues)) throw new Error('巡检记录缺少问题清单，请重新巡检。');
    if (siteStates.get(id) === s && s.scanId === scanId) {
      s.issues = issues;
      s.links = scan.report || null;
      const saved = unwrapDiagnosis(scan.diagnosis);
      if (saved && !s.diagnosis && !s.diagnosing && !s.diagnosisError) s.diagnosis = saved;
    }
  } catch (e) {
    if (siteStates.get(id) === s && s.scanId === scanId) s.error = e.message;
  } finally {
    if (siteStates.get(id) === s && s.scanId === scanId) { s.loading = false; render(); }
  }
}

async function addSite() {
  if (adding) return;
  const url = $('siteUrl').value.trim();
  if (!url) { toast('请填写站点地址'); $('siteUrl').focus(); return; }
  const name = $('siteName').value;
  adding = true;
  syncControls();
  try {
    await api('/api/sites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, url }) });
    $('siteName').value = ''; $('siteUrl').value = '';
    toast('已添加，请点击“巡检”检查该站点。');
    await load();
  } catch (e) { toast('添加失败：' + e.message); }
  finally { adding = false; syncControls(); }
}

async function removeSite(id) {
  const row = rows.find((r) => r.site_id === id);
  if (!row || activeScan !== null) return;
  const s = stateFor(row);
  if (s.deleting || s.diagnosing || s.verifying) return;
  s.deleting = true;
  render();
  try { await api('/api/sites/' + id, { method: 'DELETE' }); toast('已删除'); await load(); }
  catch (e) { toast('删除失败：' + e.message); }
  finally { s.deleting = false; render(); }
}

async function scanOne(id) {
  const row = rows.find((r) => r.site_id === id);
  if (!row || activeScan !== null) return;
  const s = stateFor(row);
  if (s.diagnosing || s.deleting || s.verifying) return;
  activeScan = id;
  s.scanError = '';
  render();
  toast('正在巡检，请稍候，避免重复操作。');
  try {
    const r = await api('/api/sites/' + id + '/scan', { method: 'POST' }, 180000);
    toast(`巡检完成，发现 ${(r.report?.issues || []).length} 个问题。`);
    await load();
  } catch (e) { s.scanError = e.message; toast('巡检失败：' + e.message); }
  finally { activeScan = null; render(); }
}

async function scanAll() {
  if (activeScan !== null || !rows.length || rows.some((r) => { const s = stateFor(r); return s.diagnosing || s.deleting || s.verifying; })) return;
  activeScan = 'all';
  rows.forEach((r) => { stateFor(r).scanError = ''; });
  render();
  toast('正在巡检全部站点，请稍候。');
  try {
    const result = await api('/api/scan/all', { method: 'POST' }, 180000);
    const scans = result.scans || [];
    const failures = scans.filter((scan) => scan.error);
    for (const scan of failures) {
      const s = siteStates.get(scan.site_id);
      if (s) s.scanError = scan.error;
    }
    toast(failures.length ? `巡检结束，${failures.length} 个站点未能完成，请查看卡片提示。` : `已巡检 ${result.count} 个站点。`);
    await load();
  } catch (e) {
    rows.forEach((r) => { stateFor(r).scanError = e.message; });
    toast('巡检失败：' + e.message);
  } finally { activeScan = null; render(); }
}

async function diagnose(siteId, scanId, inVerification = false) {
  const row = rows.find((r) => r.site_id === siteId);
  if (!row || scanId == null) { toast('请先巡检该站点'); return; }
  const s = stateFor(row);
  if (s.scanId !== scanId || s.diagnosing || s.deleting || (s.verifying && !inVerification) || activeScan === 'all' || activeScan === siteId) return;
  if (!inVerification) selectSite(siteId);
  s.diagnosing = true;
  s.diagnosisError = '';
  render();
  try {
    const result = await api('/api/scans/' + scanId + '/diagnose', { method: 'POST' }, 90000);
    const diagnosis = unwrapDiagnosis(result);
    if (!diagnosis) throw new Error('诊断结果格式不正确，请稍后重试。');
    if (siteStates.get(siteId) === s && s.scanId === scanId) {
      s.diagnosis = diagnosis;
      await loadPatches(siteId);
    }
  } catch (e) {
    if (siteStates.get(siteId) === s && s.scanId === scanId) s.diagnosisError = e.message;
  } finally {
    if (siteStates.get(siteId) === s && s.scanId === scanId) { s.diagnosing = false; render(); }
  }
}

function unwrapDiagnosis(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const result = raw.result && typeof raw.result === 'object' ? raw.result : raw;
  return !Array.isArray(result) && ['summary', 'severity', 'root_causes', 'actions'].some((key) => key in result) ? result : null;
}

const LEVEL_RANK = { P0: 0, P1: 1, P2: 2, P3: 3 };

function healthFor(row, s) {
  if (row.scan_id == null) return { state: 'unknown', label: '尚未巡检' };
  if (!row.is_ok || s.issues?.some((i) => LEVEL_RANK[i.level] <= 2)) return { state: 'bad', label: '有异常' };
  if (s.issues === null || s.error || s.issues.some((i) => !(i.level in LEVEL_RANK))) return { state: 'unknown', label: '状态待确认' };
  return { state: 'ok', label: s.issues.length ? '正常 · 有低优先级提醒' : '正常' };
}

function selectSite(id) {
  const row = rows.find((r) => r.site_id === id);
  if (!row) return;
  const changed = trendSiteId !== id;
  trendSiteId = id;
  $('trendSite').value = String(id);
  render();
  if (changed) loadTrend();
  const s = stateFor(row);
  if (row.scan_id != null && s.patches === null && !s.patchLoading && !s.patchError && !s.diagnosing) loadPatches(id, true);
}

function rememberAdvice(id, open) {
  const s = siteStates.get(id);
  if (s) s.adviceExpanded = open;
}

function renderAdvice() {
  const row = rows.find((r) => r.site_id === trendSiteId);
  if (!row) {
    $('adviceTitle').textContent = 'AI 建议与修复验证';
    $('adviceCard').setAttribute('aria-busy', 'false');
    $('adviceBody').innerHTML = '<p class="sub">添加并选择站点后，在这里查看 AI 建议与修复方案。</p>';
    return;
  }
  const s = stateFor(row);
  const busy = activeScan !== null || s.diagnosing || s.deleting || s.verifying;
  $('adviceTitle').textContent = 'AI 建议与修复验证 · ' + row.name;
  $('adviceCard').setAttribute('aria-busy', String(s.diagnosing || s.verifying || s.patchLoading));
  const diagnosis = s.diagnosis ? renderDiag(s.diagnosis, row.site_id, s.adviceExpanded) : '<p class="sub">先巡检，再点击 AI 诊断获取修复建议。</p>';
  const diagnosticStatus = s.diagnosing ? '<p role="status">AI 正在分析，请稍候…</p>' : '';
  const error = s.diagnosisError ? `<div class="inline-error" role="alert"><p>诊断失败：${esc(s.diagnosisError)}</p><button onclick="diagnose(${row.site_id}, ${row.scan_id})" ${busy ? 'disabled' : ''}>重试诊断</button></div>` : '';
  $('adviceBody').innerHTML = `<p class="sub">${row.scan_id == null ? '尚未巡检' : '当前巡检 #' + row.scan_id}</p>${diagnosticStatus}${error}${diagnosis}
    <div class="row" style="margin-top:10px"><button class="primary" onclick="diagnose(${row.site_id}, ${row.scan_id ?? 'null'})" ${row.scan_id == null || busy ? 'disabled' : ''}>${s.diagnosing ? '诊断中…' : '获取 AI 建议'}</button></div>
    <p class="sub">请先在自己管理的网站上核对并手动应用方案，再重新巡检；本页面不会修改远程网站。</p>
    <button id="verify-${row.site_id}" class="primary" onclick="verifyFix(${row.site_id})" ${busy || row.scan_id == null || !s.diagnosis || s.issues === null ? 'disabled' : ''}>${s.verifying ? '正在复扫验证…' : '应用修复后重新巡检'}</button>
    ${renderVerification(row, s)}${renderPatches(row, s)}`;
}

function renderPatchWarnings(s) {
  const list = Array.isArray(s.patchWarnings) ? s.patchWarnings : [];
  if (!list.length) return '';
  return `<div class="patch-warn" role="alert"><b>铁律校验提示 · ${list.length} 条</b><ul>${list.map((w) => `<li>${esc(w)}</li>`).join('')}</ul><span>以上为自动校验发现的风险项，复制前请人工复核；含删除类命令的补丁不要直接执行。</span></div>`;
}

function renderPatches(row, s) {
  if (s.patchLoading) return '<p role="status">正在读取修复片段…</p>';
  if (s.patchError) return `<div class="inline-error" role="alert"><p>读取修复片段失败：${esc(s.patchError)}</p><button onclick="loadPatches(${row.site_id})">重试读取补丁</button></div>`;
  if (s.patches === null) return '';
  if (!s.patches.length) return '<p class="sub">本次无需代码修改。若仍有问题，请按处理建议排查。</p>';
  return `${renderPatchWarnings(s)}<h3 style="font-size:13px;margin-bottom:0">修复片段 · ${s.patches.length} 段</h3>${s.patches.map((p, index) => `<section class="patch-card"><div class="patch-heading"><h4>${esc(p.title || '修复片段')}</h4><button onclick="copyPatch(${row.site_id}, ${row.scan_id}, ${index})" aria-label="复制修复片段 ${index + 1}">一键复制</button></div><span class="sub">${esc(p.category || '未分类')} · ${esc(p.language || '纯文本')}</span><pre><code>${esc(p.code)}</code></pre></section>`).join('')}
    <p role="status" aria-live="polite">${esc(s.copyStatus)}</p>${s.manualCopy !== null ? `<label for="manualCopy-${row.site_id}">浏览器未允许自动复制，请选中下方原文手动复制：</label><textarea class="manual-copy" id="manualCopy-${row.site_id}" readonly>${esc(s.manualCopy)}</textarea>` : ''}`;
}

async function loadPatches(id, optional = false) {
  const row = rows.find((r) => r.site_id === id);
  if (!row || row.scan_id == null) return;
  const s = stateFor(row);
  const scanId = row.scan_id;
  const request = ++s.patchRequest;
  s.patchLoading = true;
  s.patchError = '';
  render();
  try {
    // 补丁只消费后端统一契约，不读取诊断原始 result 的 patch / patches。
    const result = await api('/api/scans/' + scanId + '/patch');
    if (result.scan_id !== scanId || result.site_id !== id || !Array.isArray(result.patches)) throw new Error('补丁与当前巡检不匹配，或返回格式不正确。');
    if (result.patches.some((p) => !p || typeof p.code !== 'string' || !p.code.trim())) throw new Error('补丁正文为空或格式不正确，请重新诊断后再试。');
    if (siteStates.get(id) !== s || s.scanId !== scanId || request !== s.patchRequest) return;
    s.patches = result.patches;
    s.patchWarnings = Array.isArray(result.patch_warnings) ? result.patch_warnings.map(String) : [];
    s.copyStatus = '';
    s.manualCopy = null;
    if (!s.diagnosis) s.diagnosis = { summary: result.summary, severity: result.severity, _meta: { model: result.model } };
  } catch (e) {
    if (siteStates.get(id) === s && s.scanId === scanId && request === s.patchRequest) {
      // 未诊断的历史记录允许正常浏览；真正的读取失败提供单独重试。
      if (!(optional && e.status === 400)) s.patchError = e.message;
    }
  } finally {
    if (siteStates.get(id) === s && s.scanId === scanId && request === s.patchRequest) { s.patchLoading = false; render(); }
  }
}

async function copyPatch(id, scanId, index) {
  const s = siteStates.get(id);
  const patch = s?.scanId === scanId ? s.patches?.[index] : null;
  if (!patch) return;
  const text = patch.code;
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
    if (siteStates.get(id) !== s || s.scanId !== scanId) return;
    s.copyStatus = '已复制第 ' + (index + 1) + ' 段修复片段。';
    s.manualCopy = null;
  } catch {
    if (siteStates.get(id) !== s || s.scanId !== scanId) return;
    s.copyStatus = '自动复制未成功，可手动复制原文。';
    s.manualCopy = text;
  }
  render();
  const field = $('manualCopy-' + id);
  if (s.manualCopy !== null && field) { field.focus({ preventScroll: true }); field.select(); }
}

function scanSnapshot(scan) {
  const issues = Array.isArray(scan.report?.issues) ? scan.report.issues : scan.issues;
  if (!Array.isArray(issues)) throw new Error('巡检记录缺少问题清单，暂不能验证修复。');
  return { id: scan.id, siteId: scan.site_id, time: scan.created_at || '', report: scan.report || {}, issues };
}

function issueKey(issue) {
  const category = issue.category || 'unknown';
  // SEO 同类里有三个独立问题，不能把 title 修复误判成 description 修复。
  if (category === 'seo') {
    const m = String(issue.message || '').match(/description|title|H1/i);
    return category + ':' + (m ? m[0].toLowerCase() : issue.message);
  }
  return category;
}

function compareScans(before, after) {
  const report = after.report;
  const measurable = !report.error && report.ok === true && Number(report.status_code) >= 200 && Number(report.status_code) < 400;
  const result = before.issues.map((old) => {
    const matches = after.issues.filter((i) => issueKey(i) === issueKey(old));
    const next = matches.slice().sort((a, b) => (LEVEL_RANK[a.level] ?? -1) - (LEVEL_RANK[b.level] ?? -1))[0];
    if (next) {
      const a = LEVEL_RANK[old.level], b = LEVEL_RANK[next.level];
      const status = a === undefined || b === undefined ? 'unconfirmed' : b > a ? 'improved' : b < a ? 'worsened' : 'remaining';
      return { old, next, status };
    }
    if (!measurable || !(old.level in LEVEL_RANK)) return { old, status: 'unconfirmed' };
    if (old.category === 'ssl' && !Number.isFinite(report.ssl_days_left)) return { old, status: 'unconfirmed' };
    if (old.category === 'performance' && !Number.isFinite(report.response_ms)) return { old, status: 'unconfirmed' };
    if (old.category === 'seo' && !['title', 'description', 'h1_count'].every((key) => key in report)) return { old, status: 'unconfirmed' };
    if (old.category === 'accessibility' && !Number.isFinite(report.images_without_alt)) return { old, status: 'unconfirmed' };
    const linkFields = { broken_link: 'broken_links', link_server_error: 'server_error_links', link_unverified: 'unverified_links' };
    if (old.category in linkFields) {
      if (!['broken_links', 'server_error_links', 'unverified_links'].every((key) => Array.isArray(report[key]))) return { old, status: 'unconfirmed' };
      const urls = (before.report[linkFields[old.category]] || []).map((link) => link.url);
      // 失效链接变成限流、超时或 5xx 时，不能宣称已经修复。
      const uncertain = [...report.unverified_links, ...report.server_error_links].some((link) => urls.includes(link.url));
      if (uncertain) return { old, status: 'unconfirmed' };
    }
    return { old, status: 'resolved' };
  });
  const oldKeys = new Set(before.issues.map(issueKey));
  return { items: result, added: after.issues.filter((i) => !oldKeys.has(issueKey(i))), measurable };
}

function renderVerification(row, s) {
  const v = s.verification;
  if (!v) return '';
  if (v.error) return `<section class="verification" role="alert"><b>验证尚未完成</b><p>${esc(v.error)}</p>${v.afterId ? `<button onclick="retryVerification(${row.site_id})" ${s.verifying ? 'disabled' : ''}>重新读取对比结果（不重复巡检）</button>` : '<p class="sub">若请求超时，请先刷新历史记录确认是否已完成巡检，再决定是否复扫。</p>'}</section>`;
  if (!v.result) return '<p class="verification" role="status">正在保存基线、重新巡检并读取对比结果…</p>';
  const labels = { resolved: '✅ 该问题已修复（本次未再发现）', improved: '↘ 问题有所改善，等级下降', remaining: '⚠️ 问题仍存在', worsened: '⚠️ 问题加重', unconfirmed: '待确认：本次证据不足，不能判定修复' };
  return `<section class="verification"><h3 style="font-size:13px;margin:0">复扫对比 · #${v.before.id} → #${v.afterId}</h3><p class="sub">${esc(v.before.time)} → ${esc(v.after.time)} · 响应 ${esc(v.before.report.response_ms ?? '—')} → ${esc(v.after.report.response_ms ?? '—')} ms</p>
    ${!v.result.measurable ? '<p class="inline-error">本次网站访问异常，未再次报出的问题不能据此判为已修复。</p>' : ''}
    ${v.result.items.length ? `<ul class="comparison-list">${v.result.items.map((i) => `<li class="${i.status}"><b>${labels[i.status]}</b><br>${esc(i.old.message)}<br><span class="sub">${esc(i.old.level)} → ${esc(i.next?.level || (i.status === 'resolved' ? '未再发现' : '无法确认'))}${i.next ? ' · ' + esc(i.next.message) : ''}</span></li>`).join('')}</ul>` : '<p>基线没有问题，无需判定修复。</p>'}
    ${v.result.added.length ? `<h4>本次新增的问题</h4><ul>${v.result.added.map((i) => `<li>${esc(i.level)} · ${esc(i.message)}</li>`).join('')}</ul>` : ''}
    <p class="sub">对比针对上述两次巡检；瞬时变化仍需持续观察。本次对比仅在当前页面保留，下次复扫以当前巡检为基线。</p></section>`;
}

async function finishVerification(id, s, v) {
  const [raw, history] = await Promise.all([api('/api/scans/' + v.afterId), api('/api/scans?site_id=' + id + '&limit=50')]);
  const after = scanSnapshot(raw);
  if (after.siteId !== id || after.id !== v.afterId || !Array.isArray(history) || !history.some((scan) => scan.id === v.afterId && scan.site_id === id)) throw new Error('复扫记录尚未与该站点的历史对应，请重试读取。');
  if (siteStates.get(id) !== s || s.verification !== v) return;
  v.after = after;
  v.result = compareScans(v.before, after);
  v.error = '';
  toast(`复扫完成：原有 ${v.before.issues.length} 项问题，本次发现 ${after.issues.length} 项。请查看前后对比。`);
  await load();
  activeScan = null;
  const row = rows.find((r) => r.site_id === id);
  if (row?.scan_id === v.afterId) await diagnose(id, v.afterId, true);
}

async function verifyFix(id) {
  const row = rows.find((r) => r.site_id === id);
  if (!row || row.scan_id == null || activeScan !== null) return;
  const s = stateFor(row);
  if (!s.diagnosis || s.issues === null || s.diagnosing || s.deleting || s.verifying) return;
  const before = { id: row.scan_id, siteId: id, time: row.created_at || '', report: s.links || {}, issues: s.issues.map((i) => ({ ...i })) };
  const v = { before, afterId: null, after: null, result: null, error: '' };
  s.verification = v;
  s.verifying = true;
  s.scanError = '';
  activeScan = id;
  toast('正在重新巡检并验证修复，请稍候。');
  render();
  try {
    const result = await api('/api/sites/' + id + '/scan', { method: 'POST' }, 180000);
    if (!Number.isInteger(result.scan_id) || result.scan_id === before.id) throw new Error('未收到新的巡检编号，请刷新历史记录核对。');
    v.afterId = result.scan_id;
    await finishVerification(id, s, v);
  } catch (e) { if (siteStates.get(id) === s) v.error = e.message; }
  finally { s.verifying = false; activeScan = null; render(); }
}

async function retryVerification(id) {
  const s = siteStates.get(id);
  const v = s?.verification;
  if (!v?.afterId || s.verifying || s.diagnosing || s.deleting || activeScan !== null) return;
  s.verifying = true;
  v.error = '';
  activeScan = id;
  render();
  try { await finishVerification(id, s, v); }
  catch (e) { v.error = e.message; }
  finally { s.verifying = false; activeScan = null; render(); }
}

function renderDiag(d, siteId = null, expanded = false) {
  const causes = (Array.isArray(d.root_causes) ? d.root_causes : []).map((c) => `<li><b>${esc(c?.issue)}</b><br><i>${esc(c?.reason)}</i></li>`).join('');
  const actions = (Array.isArray(d.actions) ? d.actions : []).map((a) => `<li>[步骤 ${esc(a?.priority)}] <b>${esc(a?.action)}</b><br><i>${esc(a?.how)}</i></li>`).join('');
  const meta = d._meta || {};
  const level = ['P0', 'P1', 'P2', 'P3'].includes(d.severity) ? d.severity : '';
  const model = typeof meta.model === 'string' ? meta.model.trim() : '';
  const mock = model === 'mock-diagnosis' || meta.provider === 'mock';
  const source = mock ? `<div class="mocknote"><b>模拟模式</b> —— 结论由内置规则生成，未调用真实大模型。${esc(meta.note || '')}</div>`
    : `<div class="modelnote"><span class="badge ${model ? 'ok' : ''}">${model ? '由华为云 MaaS 大模型诊断' : '诊断来源未标明'}</span>${model ? `<span class="sub">${esc(model)}</span>` : ''}${Number.isFinite(meta.total_tokens) ? `<span class="sub">${meta.total_tokens} tokens</span>` : ''}</div>`;
  return `${source}<div class="advice-summary"><span class="sev ${level}">${esc(d.severity || '未分级')}</span> ${esc(d.summary || '未提供诊断摘要')}</div><details class="advice-details" ${expanded ? 'open' : ''} ontoggle="rememberAdvice(${siteId}, this.open)"><summary>根因与处理建议</summary><h4>根因分析</h4>${causes ? `<ul>${causes}</ul>` : '<p class="sub">暂无根因明细，可点击 AI 诊断获取。</p>'}<h4>处置建议</h4>${actions ? `<ul>${actions}</ul>` : '<p class="sub">暂无处置明细。</p>'}</details>`;
}

async function pingMaas() {
  if (pinging) return;
  pinging = true;
  $('pingButton').disabled = true;
  $('pingButton').textContent = '测试中…';
  try {
    const result = await api('/api/status/maas-ping', { method: 'POST' }, 90000);
    toast((result.mock ? '模拟诊断可用：' : '大模型连通正常：') + result.reply);
  } catch (e) { toast('连通失败：' + e.message); }
  finally { pinging = false; $('pingButton').disabled = false; $('pingButton').textContent = '测试大模型连通性'; }
}

function syncTrendSites(allowLoad) {
  if (!rows.length) {
    ++trendRequest;
    trendSiteId = null;
    trendScanId = null;
    trendHistory = null;
    trendLoading = false;
    trendError = overviewError ? '请先重试加载站点，再查看趋势。' : '';
    $('trendSite').innerHTML = '<option value="">暂无监控站点</option>';
    $('trendSite').disabled = true;
    renderTrend();
    return;
  }
  const previous = trendSiteId;
  if (!rows.some((r) => r.site_id === trendSiteId)) trendSiteId = (rows.find((r) => r.scan_id != null) || rows[0]).site_id;
  $('trendSite').innerHTML = rows.map((r) => `<option value="${r.site_id}" ${r.site_id === trendSiteId ? 'selected' : ''}>${esc(r.name)}</option>`).join('');
  $('trendSite').disabled = false;
  const selected = rows.find((r) => r.site_id === trendSiteId);
  if (allowLoad && (previous !== trendSiteId || selected.scan_id !== trendScanId || (trendHistory === null && !trendLoading && !trendError))) loadTrend();
  else renderTrend();
}

function selectTrend() {
  const id = Number($('trendSite').value);
  if (!rows.some((r) => r.site_id === id)) return;
  selectSite(id);
}

function normalizeHistory(history) {
  return history.slice().sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')) || (a.id || 0) - (b.id || 0)).map((scan) => ({
    time: typeof scan.created_at === 'string' && scan.created_at ? scan.created_at.replace('T', ' ') : '时间未记录',
    ms: typeof scan.response_ms === 'number' && Number.isFinite(scan.response_ms) && scan.response_ms >= 0 ? scan.response_ms : null,
  }));
}

async function loadTrend() {
  const selected = rows.find((r) => r.site_id === trendSiteId);
  if (!selected) return;
  const siteId = selected.site_id;
  const request = ++trendRequest;
  trendScanId = selected.scan_id;
  trendLoading = true;
  trendError = '';
  renderTrend();
  try {
    const history = await api('/api/scans?site_id=' + siteId + '&limit=50');
    if (!Array.isArray(history)) throw new Error('巡检历史格式不正确。');
    const normalized = normalizeHistory(history);
    if (normalized.some((scan) => scan.ms !== null)) await ensureCharts();
    if (request === trendRequest && trendSiteId === siteId) trendHistory = normalized;
  } catch (e) {
    if (request === trendRequest && trendSiteId === siteId) trendError = e.message;
  } finally {
    if (request === trendRequest && trendSiteId === siteId) { trendLoading = false; renderTrend(); }
  }
}

function ensureCharts() {
  if (window.echarts) return Promise.resolve(window.echarts);
  if (chartLibraryPromise) return chartLibraryPromise;
  chartLibraryPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    let finished = false;
    const finish = (error) => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      script.onload = null;
      script.onerror = null;
      if (error) { script.remove(); reject(error); }
      else resolve(window.echarts);
    };
    const timer = setTimeout(() => finish(new Error('图表组件加载超时，请刷新页面重试。')), 15000);
    script.src = ECHARTS_URL;
    script.async = true;
    script.onload = () => finish(window.echarts ? null : new Error('图表组件未能初始化，请重试。'));
    script.onerror = () => finish(new Error('图表组件加载失败（本地 /static/vendor/echarts.min.js 未能加载），请刷新页面重试。'));
    document.head.appendChild(script);
  }).catch((error) => { chartLibraryPromise = null; throw error; });
  return chartLibraryPromise;
}

function renderTrend() {
  const selected = rows.find((r) => r.site_id === trendSiteId);
  const chartElement = $('trendChart');
  const status = $('trendStatus');
  $('trendCard').setAttribute('aria-busy', String(trendLoading));
  $('trendRefresh').disabled = trendLoading || !selected;
  $('trendRefresh').textContent = trendLoading ? '加载中…' : '刷新趋势';
  $('trendSummary').textContent = '';
  chartElement.hidden = true;
  status.setAttribute('role', trendError ? 'alert' : 'status');
  if (trendLoading) { status.innerHTML = '<p>正在加载巡检历史与趋势图…</p>'; return; }
  if (trendError) {
    status.innerHTML = `<div class="inline-error"><p>趋势加载失败：${esc(trendError)}</p>${selected ? '<button onclick="loadTrend()">重试加载趋势</button>' : ''}</div>`;
    return;
  }
  if (!selected) { status.innerHTML = '<p class="sub">添加站点并进行巡检后，即可查看响应耗时的变化。</p>'; return; }
  if (!trendHistory?.length) { status.innerHTML = '<p class="sub">暂无巡检记录，请先巡检这个站点。</p>'; return; }
  const valid = trendHistory.filter((scan) => scan.ms !== null);
  if (!valid.length) { status.innerHTML = '<p class="sub">已有巡检记录，但未取得有效响应耗时，请先排查网站访问问题。</p>'; return; }
  status.innerHTML = '';
  chartElement.hidden = false;
  const latest = valid[valid.length - 1];
  const missing = trendHistory.length - valid.length;
  $('trendSummary').textContent = `${selected.name} · 共 ${trendHistory.length} 次巡检，最近一次有效耗时 ${latest.ms} ms${missing ? `；${missing} 次未取得耗时，图中留空` : ''}${trendHistory.length === 1 ? '。当前只有一个数据点，后续巡检后即可比较趋势。' : '。'}`;
  chartElement.setAttribute('aria-label', `${selected.name}的响应耗时趋势，共${trendHistory.length}次巡检，${valid.length}次取得有效耗时。`);
  try {
    if (!trendChart) trendChart = window.echarts.init(chartElement, null, { renderer: 'svg' });
    const compact = chartElement.clientHeight > 0 && chartElement.clientHeight <= 130;
    trendChart.setOption({
      animation: false,
      aria: { enabled: true, description: chartElement.getAttribute('aria-label') },
      grid: { left: 16, right: 24, top: compact ? 24 : 36, bottom: compact ? 8 : 60, containLabel: true },
      tooltip: { trigger: 'axis', renderMode: 'richText', formatter: (items) => {
        const scan = trendHistory[items[0]?.dataIndex];
        return scan ? `${scan.time}\n响应耗时：${scan.ms === null ? '未取得响应' : scan.ms + ' ms'}` : '';
      } },
      xAxis: { type: 'category', boundaryGap: false, name: compact ? '' : '巡检时间', nameLocation: 'middle', nameGap: 42, data: trendHistory.map((scan) => scan.time), axisLabel: { hideOverlap: true, formatter: (value) => /^\d{4}-\d{2}-\d{2}/.test(value) ? (compact ? value.slice(11, 16) : value.slice(5, 16).replace(' ', '\n')) : value } },
      yAxis: { type: 'value', min: 0, name: '耗时（ms）', nameGap: 16 },
      series: [{ name: '响应耗时', type: 'line', data: trendHistory.map((scan) => scan.ms), connectNulls: false, symbol: 'circle', symbolSize: 7, lineStyle: { color: '#1f5fa9' }, itemStyle: { color: '#1f5fa9' } }],
    }, { notMerge: true });
    trendChart.resize();
  } catch {
    trendError = '图表未能显示，请重试。';
    renderTrend();
  }
}

window.addEventListener('resize', () => { if (trendChart && !$('trendChart').hidden) trendChart.resize(); });
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { if (trendChart && !$('trendChart').hidden) trendChart.resize(); }).observe($('trendChart'));
window.addEventListener('pagehide', () => { if (trendChart) { trendChart.dispose(); trendChart = null; } });
window.addEventListener('pageshow', (event) => { if (event.persisted) renderTrend(); });

function refresh() { return Promise.all([loadStatus(), load()]); }
refresh();

</script>
</body>
</html>
